name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation dependencies
        run: |
          python -m pip install --requirement requirements.txt
          sudo apt-get update
          sudo apt-get install --yes shellcheck
      - name: Run regression and static checks
        run: |
          python -m unittest discover -v
          python -m py_compile scripts/build_skills.py scripts/validate_generated.py
          shellcheck install.sh
          find skills -type f -name '*.sh' -print0 | xargs -0 shellcheck
          python -m json.tool skills/manifest.json >/dev/null
          python scripts/validate_generated.py skills
      - name: Rebuild both host distributions from the pinned source
        run: |
          source_revision=$(python -c 'import json; print(json.load(open("skills/manifest.json"))["source_revision"])')
          git clone --filter=blob:none https://github.com/cursor/plugins.git upstream-plugins
          git -C upstream-plugins checkout "$source_revision"
          python scripts/build_skills.py --source upstream-plugins --output regenerated-skills
          python scripts/validate_generated.py regenerated-skills
          diff -qr skills regenerated-skills
